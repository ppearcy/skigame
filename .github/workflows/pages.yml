name: Publish to GitHub Pages

# Pages serves the gh-pages branch; this keeps it in sync with the
# development branch so every push updates the live game.
on:
  push:
    branches: [claude/game-terrain-variance-s7a0b9, claude/fervent-wright-ghtta7, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror this commit to gh-pages
        run: git push --force origin HEAD:gh-pages
